<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2c6e91">
<link rel="icon" href="data:,">
<title>Inglese A2 → B1</title>
<style>
  :root {
    --acc: #2c6e91; --acc-chiaro: #e3edf3; --ok: #2e7d32; --ok-bg: #e8f3e9;
    --ko: #b3372f; --ko-bg: #faeae8; --carta: #ffffff; --sfondo: #f0f3f5;
    --testo: #23272b; --grigio: #6b7680; --bordo: #d8dfe4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    margin: 0; background: var(--sfondo); color: var(--testo);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
  }
  #app { max-width: 640px; margin: 0 auto; padding: 0.9rem 0.9rem 4rem; }
  h1 { font-size: 1.25rem; margin: .4rem 0 .1rem; }
  h2 { font-size: 1.05rem; margin: .3rem 0; }
  .sotto { color: var(--grigio); font-size: .85rem; margin: 0 0 1rem; }
  .card {
    background: var(--carta); border: 1px solid var(--bordo); border-radius: 12px;
    padding: 1rem; margin: .7rem 0; box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .card.cliccabile { cursor: pointer; }
  .card.cliccabile:active { background: var(--acc-chiaro); }
  button {
    font: inherit; border: 1px solid var(--bordo); background: var(--carta); color: var(--testo);
    border-radius: 10px; padding: .65rem 1rem; cursor: pointer; touch-action: manipulation;
  }
  button.primario { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  button.fantasma { border: none; background: none; color: var(--acc); padding: .4rem .2rem; }
  button:disabled { opacity: .45; cursor: default; }
  .opzione {
    display: block; width: 100%; text-align: left; margin: .45rem 0; padding: .75rem .9rem;
    border-radius: 10px; border: 1.5px solid var(--bordo); background: var(--carta); font-size: 1rem;
  }
  .opzione.giusta { border-color: var(--ok); background: var(--ok-bg); }
  .opzione.sbagliata { border-color: var(--ko); background: var(--ko-bg); }
  input[type=text], textarea {
    font: inherit; width: 100%; padding: .7rem .8rem; border: 1.5px solid var(--bordo);
    border-radius: 10px; background: #fff; color: var(--testo);
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--acc); border-color: var(--acc); }
  .barra { height: 5px; background: var(--bordo); border-radius: 3px; overflow: hidden; margin: .35rem 0; }
  .barra > div { height: 100%; background: var(--acc); border-radius: 3px; transition: width .3s; }
  .riga { display: flex; gap: .6rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .esito { border-radius: 10px; padding: .8rem .9rem; margin-top: .8rem; font-size: .95rem; }
  .esito.ok { background: var(--ok-bg); border: 1px solid #bcd9be; }
  .esito.ko { background: var(--ko-bg); border: 1px solid #eac5c1; }
  .esito .titolo-esito { font-weight: 700; }
  .chip { display: inline-block; background: var(--acc-chiaro); color: var(--acc); border-radius: 8px;
          padding: .15rem .55rem; margin: .15rem .2rem .15rem 0; font-size: .9rem; }
  .testo-item { font-size: 1.05rem; margin: .6rem 0 .8rem; }
  .istruzione { color: var(--grigio); font-size: .88rem; margin-bottom: .2rem; }
  .mini { color: var(--grigio); font-size: .82rem; }
  .lettura { background: #f6f8f9; border: 1px solid var(--bordo); border-radius: 10px; padding: .2rem .9rem; margin: .6rem 0; }
  .lettura p { margin: .6rem 0; }
  .grammatica table { border-collapse: collapse; width: 100%; font-size: .88rem; margin: .6rem 0; }
  .grammatica th, .grammatica td { border: 1px solid var(--bordo); padding: .4rem .5rem; text-align: left; }
  .grammatica th { background: var(--acc-chiaro); }
  .intest { display: flex; align-items: center; gap: .5rem; margin-top: .3rem; }
  .indietro { font-size: 1.3rem; line-height: 1; border: none; background: none; color: var(--acc); cursor: pointer; padding: .3rem .5rem .3rem 0; }
  .spunta { color: var(--ok); font-weight: 700; }
  .criterio { display: flex; gap: .6rem; align-items: flex-start; margin: .5rem 0; }
  .criterio input { width: 1.2rem; height: 1.2rem; margin-top: .2rem; flex: none; }
  .azioni { display: flex; gap: .6rem; margin-top: .9rem; flex-wrap: wrap; }
  .contaparole { text-align: right; }
  .nota-ff { background: #fff8e6; border: 1px solid #eadfb8; border-radius: 10px; padding: .7rem .9rem; margin-top: .8rem; font-size: .92rem; }
  #esporta-area { width: 100%; min-height: 10rem; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; }
  .centrato { text-align: center; }
  @media (min-width: 700px) { #app { padding-top: 2rem; } }
</style>
</head>
<body>
<div id="app"><p style="padding:1rem">Caricamento…</p></div>

<script src="esercizi.js"></script>
<script>
'use strict';

/* ============================== stato ============================== */

const CHIAVE_LS = 'inglese-a2b1-progressi-v1';
let DATI = null;
let rotta = { vista: 'home' };

function caricaProgressi() {
  try { return JSON.parse(localStorage.getItem(CHIAVE_LS)) || {}; }
  catch (e) { return {}; }
}
function salvaProgressi(p) { localStorage.setItem(CHIAVE_LS, JSON.stringify(p)); }
let prog = caricaProgressi();

function statoItem(uid, sez, n) { return (prog[uid] || {})[sez + '.' + n] || null; }
function segnaItem(uid, sez, n, stato) {
  prog[uid] = prog[uid] || {};
  prog[uid][sez + '.' + n] = stato;
  salvaProgressi(prog);
}

/* ============================ utilità ============================ */

function el(tag, attrs, ...figli) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else e.setAttribute(k, v);
  }
  for (const f of figli) if (f != null) e.append(f);
  return e;
}
function testoPuro(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.trim(); }

function normalizza(s) {
  s = (s || '').toLowerCase().trim()
    .replace(/[’‘`´]/g, "'")
    .replace(/\s+/g, ' ')
    .replace(/[.,!?;:]+$/, '').trim();
  const regole = [
    [/(^|\s)i'm\b/g, '$1i am'], [/(^|\s)'m\b/g, '$1am'],
    [/(^|\s)won't\b/g, '$1will not'], [/(^|\s)can't\b/g, '$1cannot'],
    [/n't\b/g, ' not'], [/'re\b/g, ' are'], [/'ve\b/g, ' have'], [/'ll\b/g, ' will'],
    [/(^|\s)(it|he|she|that|there|who|what)'s\b/g, '$1$2 is'],
  ];
  for (const [re, sost] of regole) s = s.replace(re, sost);
  return s.replace(/\s+/g, ' ').trim();
}
function rispostaCombacia(data, accettate) {
  const dn = normalizza(data);
  const dnSenzaSogg = dn.replace(/^(i|you|he|she|it|we|they) /, '');
  for (const a of accettate) {
    const an = normalizza(a);
    if (dn === an || dnSenzaSogg === an) return true;
    if (dn.replace(/'/g, '') === an.replace(/'/g, '')) return true;
  }
  return false;
}

function itemsDiSezione(sez) {
  if (sez.blocchi) return sez.blocchi.flatMap(b => b.item.map(it => ({ ...it, istruzione: b.istruzione })));
  if (sez.item) return sez.item.map(it => ({ ...it, istruzione: '' }));
  return [];
}
function conteggiUnita(u) {
  let fatti = 0, ko = 0;
  for (const sez of u.sezioni) {
    for (const it of itemsDiSezione(sez)) {
      const st = statoItem(u.id, sez.numero, it.n);
      if (st) { fatti++; if (st.s === 'ko') ko++; }
    }
  }
  return { fatti, ko, totale: u.totaleItem };
}

function render() {
  const app = document.getElementById('app');
  app.replaceChildren();
  if (rotta.vista === 'home') app.append(vistaHome());
  else if (rotta.vista === 'unita') app.append(vistaUnita(rotta.uid));
  else if (rotta.vista === 'sezione') app.append(vistaSezione(rotta.uid, rotta.sez));
  else if (rotta.vista === 'esporta') app.append(vistaEsporta());
  window.scrollTo(0, 0);
}
function vai(nuova) { rotta = nuova; render(); }

/* ============================== home ============================== */

function vistaHome() {
  const box = el('div', {});
  box.append(
    el('h1', {}, 'Inglese A2 → B1'),
    el('p', { class: 'sotto' }, 'Eserciziario · consegne in italiano, esercizi in inglese')
  );
  for (const u of DATI.unita) {
    const c = conteggiUnita(u);
    const perc = c.totale ? Math.round(100 * c.fatti / c.totale) : 0;
    const card = el('div', { class: 'card cliccabile', onclick: () => vai({ vista: 'unita', uid: u.id }) },
      el('div', { class: 'riga' },
        el('h2', {}, `Unit ${String(u.numero).padStart(2, '0')} — ${u.titolo}`),
        c.fatti >= c.totale && c.totale ? el('span', { class: 'spunta' }, '✓') : null
      ),
      el('div', { class: 'mini' }, u.focus || ''),
      el('div', { class: 'barra' }, el('div', { style: `width:${perc}%` })),
      el('div', { class: 'mini' }, `${c.fatti}/${c.totale} svolti` + (c.ko ? ` · ${c.ko} da rivedere` : ''))
    );
    box.append(card);
  }
  box.append(el('div', { class: 'azioni' },
    el('button', { onclick: () => vai({ vista: 'esporta' }) }, 'Esporta gli errori'),
    el('button', { onclick: azzeraTutto }, 'Azzera tutto')
  ));
  return box;
}
function azzeraTutto() {
  if (confirm('Cancellare tutti i progressi salvati su questo dispositivo?')) {
    prog = {}; salvaProgressi(prog); render();
  }
}

/* ============================== unità ============================== */

function vistaUnita(uid) {
  const u = DATI.unita.find(x => x.id === uid);
  const box = el('div', {});
  box.append(
    el('div', { class: 'intest' },
      el('button', { class: 'indietro', onclick: () => vai({ vista: 'home' }) }, '‹'),
      el('h1', {}, `Unit ${String(u.numero).padStart(2, '0')} — ${u.titolo}`)
    ),
    el('p', { class: 'sotto' }, (u.focus ? u.focus + ' · ' : '') + (u.tempo ? `circa ${u.tempo} minuti` : ''))
  );
  for (const sez of u.sezioni) {
    if (sez.numero === 2) {
      const letto = (prog[uid] || {})['_g2'];
      box.append(el('div', { class: 'card cliccabile', onclick: () => vai({ vista: 'sezione', uid, sez: 2 }) },
        el('div', { class: 'riga' }, el('strong', {}, '2. ' + sez.titolo), letto ? el('span', { class: 'spunta' }, '✓') : el('span', { class: 'mini' }, 'da leggere'))
      ));
      continue;
    }
    const items = itemsDiSezione(sez);
    const fatti = items.filter(it => statoItem(uid, sez.numero, it.n)).length;
    box.append(el('div', { class: 'card cliccabile', onclick: () => vai({ vista: 'sezione', uid, sez: sez.numero }) },
      el('div', { class: 'riga' },
        el('strong', {}, sez.numero + '. ' + sez.titolo),
        fatti >= items.length ? el('span', { class: 'spunta' }, '✓') : el('span', { class: 'mini' }, `${fatti}/${items.length}`)
      )
    ));
  }
  box.append(el('div', { class: 'azioni' },
    el('button', { onclick: () => { if (confirm('Ricominciare questa unità da zero?')) { delete prog[uid]; salvaProgressi(prog); render(); } } }, 'Ricomincia unità')
  ));
  return box;
}

/* ============================= sezione ============================= */

function vistaSezione(uid, numSez) {
  const u = DATI.unita.find(x => x.id === uid);
  const sez = u.sezioni.find(s => s.numero === numSez);
  const box = el('div', {});
  box.append(el('div', { class: 'intest' },
    el('button', { class: 'indietro', onclick: () => vai({ vista: 'unita', uid }) }, '‹'),
    el('h1', {}, numSez + '. ' + sez.titolo)
  ));

  if (numSez === 2) {
    box.append(
      el('div', { class: 'card grammatica', html: sez.html }),
      el('div', { class: 'azioni' },
        el('button', { class: 'primario', onclick: () => { prog[uid] = prog[uid] || {}; prog[uid]['_g2'] = true; salvaProgressi(prog); vai({ vista: 'unita', uid }); } }, 'Letto ✓')
      )
    );
    return box;
  }

  const items = itemsDiSezione(sez);
  const idx = items.findIndex(it => !statoItem(uid, sez.numero, it.n));

  if (sez.parole && idx !== -1) {
    const chips = el('div', {});
    for (const p of sez.parole) chips.append(el('span', { class: 'chip' }, p));
    box.append(el('div', { class: 'card' }, el('div', { class: 'istruzione' }, 'Le parole da usare (una sola volta ciascuna):'), chips));
  }
  if (sez.testo) {
    const det = el('details', { open: '' },
      el('summary', { style: 'cursor:pointer;color:var(--acc);font-weight:600' }, 'Il testo da leggere'),
      el('div', { class: 'lettura', html: sez.testo }));
    box.append(el('div', { class: 'card' }, det));
  }

  if (idx === -1) { box.append(schedaFineSezione(u, sez, items)); return box; }

  const it = items[idx];
  box.append(
    el('div', { class: 'mini centrato' }, `${idx + 1} di ${items.length}`),
    el('div', { class: 'barra' }, el('div', { style: `width:${Math.round(100 * idx / items.length)}%` })),
    schedaItem(u, sez, it)
  );
  return box;
}

function schedaFineSezione(u, sez, items) {
  const uid = u.id;
  let ok = 0, ko = 0, fatto = 0;
  for (const it of items) {
    const st = statoItem(uid, sez.numero, it.n);
    if (st) { if (st.s === 'ok') ok++; else if (st.s === 'ko') ko++; else fatto++; }
  }
  const card = el('div', { class: 'card centrato' },
    el('h2', {}, 'Sezione completata'),
    el('p', {}, `${ok} giuste · ${ko} da rivedere` + (fatto ? ` · ${fatto} in autonomia` : ''))
  );
  if (sez.nota) card.append(el('div', { class: 'nota-ff', html: '⚠️ ' + sez.nota }));
  const prossima = u.sezioni.find(s => s.numero > sez.numero);
  card.append(el('div', { class: 'azioni', style: 'justify-content:center' },
    el('button', { onclick: () => { for (const it of items) delete (prog[uid] || {})[sez.numero + '.' + it.n]; salvaProgressi(prog); render(); } }, 'Rifai la sezione'),
    prossima
      ? el('button', { class: 'primario', onclick: () => vai({ vista: 'sezione', uid, sez: prossima.numero }) }, 'Sezione successiva ›')
      : el('button', { class: 'primario', onclick: () => vai({ vista: 'unita', uid }) }, 'Fine unità ✓')
  ));
  return card;
}

/* =========================== scheda item =========================== */

function schedaItem(u, sez, it) {
  const uid = u.id;
  const card = el('div', { class: 'card' });
  if (it.istruzione) card.append(el('div', { class: 'istruzione', html: it.istruzione }));
  card.append(el('div', { class: 'testo-item', html: (it.n ? `<strong>${it.n}.</strong> ` : '') + it.testo }));

  const dopo = (stato, blocco) => {
    segnaItem(uid, sez.numero, it.n, stato);
    card.append(blocco);
    card.append(el('div', { class: 'azioni' },
      el('button', { class: 'primario', onclick: () => render() }, 'Avanti ›')));
    card.querySelectorAll('input,textarea,button.opzione,button[data-azione]').forEach(x => x.disabled = true);
  };
  const esitoOk = (extra) => el('div', { class: 'esito ok' },
    el('div', { class: 'titolo-esito' }, 'Giusto!'),
    extra ? el('div', { html: extra }) : null);
  const esitoKo = (corretta, extra) => el('div', { class: 'esito ko' },
    el('div', { class: 'titolo-esito' }, 'Non proprio.'),
    el('div', {}, 'Risposta corretta: ', el('strong', { html: corretta })),
    extra ? el('div', { html: extra }) : null);

  if (it.tipo === 'mc') {
    it.opzioni.forEach((opz, i) => {
      card.append(el('button', { class: 'opzione', html: String.fromCharCode(97 + i) + ') ' + opz, onclick: (ev) => {
        const giusta = i === it.corretta;
        ev.currentTarget.classList.add(giusta ? 'giusta' : 'sbagliata');
        if (!giusta) card.querySelectorAll('.opzione')[it.corretta].classList.add('giusta');
        dopo({ s: giusta ? 'ok' : 'ko', d: testoPuro(opz), c: testoPuro(it.opzioni[it.corretta]) },
          giusta ? esitoOk(it.spiegazione) : esitoKo(it.opzioni[it.corretta], it.spiegazione));
      } }));
    });

  } else if (it.tipo === 'vf') {
    const scegli = (val, ev) => {
      const giusta = val === it.risposta;
      ev.currentTarget.classList.add(giusta ? 'giusta' : 'sbagliata');
      dopo({ s: giusta ? 'ok' : 'ko', d: val === 'V' ? 'Vero' : 'Falso', c: it.risposta === 'V' ? 'Vero' : 'Falso' },
        giusta ? esitoOk(it.risposta === 'F' ? it.spiegazione : '') : esitoKo(it.risposta === 'V' ? 'Vero' : 'Falso', it.spiegazione));
    };
    card.append(
      el('button', { class: 'opzione', onclick: (ev) => scegli('V', ev) }, 'Vero'),
      el('button', { class: 'opzione', onclick: (ev) => scegli('F', ev) }, 'Falso')
    );

  } else if (it.tipo === 'gap' || it.tipo === 'riordino') {
    const inp = el('input', { type: 'text', autocomplete: 'off', autocapitalize: 'off', placeholder: it.tipo === 'riordino' ? 'Scrivi la frase intera…' : 'Scrivi la risposta…' });
    const controlla = () => {
      if (!inp.value.trim()) return;
      const giusta = rispostaCombacia(inp.value, it.accettate);
      dopo({ s: giusta ? 'ok' : 'ko', d: inp.value.trim(), c: it.accettate[0] },
        giusta ? esitoOk(it.spiegazione) : esitoKo(it.accettate[0], it.spiegazione));
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') controlla(); });
    card.append(inp, el('div', { class: 'azioni' }, el('button', { class: 'primario', 'data-azione': '1', onclick: controlla }, 'Controlla')));

  } else if (it.tipo === 'aperta') {
    const ta = el('textarea', { placeholder: 'Scrivi la tua risposta…' });
    const mostra = () => {
      if (!ta.value.trim()) return;
      const pannello = el('div', { class: 'esito ok', style: 'background:var(--acc-chiaro);border-color:var(--bordo)' },
        el('div', { class: 'titolo-esito' }, 'Soluzione'),
        el('div', { html: it.modello }),
        it.spiegazione ? el('div', { class: 'mini', html: it.spiegazione }) : null,
        el('p', { class: 'mini' }, 'Confronta con la tua risposta: piccole differenze di parole vanno bene se grammatica e senso sono giusti.'),
        el('div', { class: 'azioni' },
          el('button', { onclick: () => dopo({ s: 'ok', d: ta.value.trim(), c: testoPuro(it.modello) }, esitoOk('')) }, 'Era giusta ✓'),
          el('button', { onclick: () => dopo({ s: 'ko', d: ta.value.trim(), c: testoPuro(it.modello) }, esitoKo(it.modello, it.spiegazione)) }, 'Era sbagliata ✗')
        )
      );
      card.append(pannello);
      bott.disabled = true;
    };
    const bott = el('button', { class: 'primario', 'data-azione': '1', onclick: mostra }, 'Confronta con la soluzione');
    card.append(ta, el('div', { class: 'azioni' }, bott));

  } else if (it.tipo === 'libera') {
    const ta = el('textarea', { placeholder: 'Scrivi la tua risposta…' });
    const fine = () => {
      if (!ta.value.trim()) return;
      dopo({ s: 'fatto', d: ta.value.trim(), c: '' },
        el('div', { class: 'esito ok', style: 'background:var(--acc-chiaro);border-color:var(--bordo)' },
          el('div', { class: 'titolo-esito' }, 'Fatto — controlla da solo'),
          el('div', { html: it.guida || '' })));
    };
    card.append(ta, el('div', { class: 'azioni' }, el('button', { class: 'primario', 'data-azione': '1', onclick: fine }, 'Fatto')));

  } else if (it.tipo === 'writing') {
    const ta = el('textarea', { placeholder: 'Scrivi qui il tuo testo…', style: 'min-height:9rem' });
    const conta = el('div', { class: 'mini contaparole' }, '0 parole');
    ta.addEventListener('input', () => {
      const n = (ta.value.trim().match(/\S+/g) || []).length;
      conta.textContent = n + ' parole' + (n >= 60 && n <= 80 ? ' ✓' : '');
    });
    const mostra = () => {
      if (!ta.value.trim()) return;
      const spunte = (it.criteri || []).map(c => {
        const cb = el('input', { type: 'checkbox' });
        return { cb, riga: el('label', { class: 'criterio' }, cb, el('span', { html: c })) };
      });
      const pannello = el('div', { class: 'esito ok', style: 'background:var(--acc-chiaro);border-color:var(--bordo)' },
        el('div', { class: 'titolo-esito' }, 'Testo modello'),
        el('div', { html: it.modello }),
        el('p', {}, el('strong', {}, 'Autovalutazione:')),
        ...spunte.map(s => s.riga),
        el('div', { class: 'azioni' },
          el('button', { class: 'primario', onclick: () => {
            const passati = spunte.filter(s => s.cb.checked).length;
            dopo({ s: passati === spunte.length ? 'ok' : 'fatto', d: ta.value.trim(), c: `criteri superati: ${passati}/${spunte.length}` },
              el('div', { class: 'esito ok' }, el('div', { class: 'titolo-esito' },
                passati === spunte.length ? 'Tutti i criteri superati.' : `Criteri superati: ${passati}/${spunte.length} — riguarda quelli mancanti.`)));
          } }, 'Ho finito'))
      );
      card.append(pannello);
      bott.disabled = true;
    };
    const bott = el('button', { class: 'primario', 'data-azione': '1', onclick: mostra }, 'Confronta con il modello');
    card.append(ta, conta, el('div', { class: 'azioni' }, bott));
  }

  return card;
}

/* ============================= esporta ============================= */

function testoReport() {
  const oggi = new Date();
  const data = String(oggi.getDate()).padStart(2, '0') + '/' + String(oggi.getMonth() + 1).padStart(2, '0') + '/' + oggi.getFullYear();
  let righe = ['REPORT ERRORI — inglese-a2-b1 — ' + data, ''];
  let totKo = 0, totFatti = 0;
  for (const u of DATI.unita) {
    const errori = [];
    for (const sez of u.sezioni) {
      for (const it of itemsDiSezione(sez)) {
        const st = statoItem(u.id, sez.numero, it.n);
        if (!st) continue;
        totFatti++;
        if (st.s === 'ko') {
          totKo++;
          errori.push(`- Sez. ${sez.numero}, item ${it.n} [${it.tipo}]` +
            `\n  data:     ${st.d}` + `\n  corretta: ${st.c}`);
        }
      }
    }
    if (errori.length) {
      righe.push(`Unit ${String(u.numero).padStart(2, '0')} — ${u.titolo}`, ...errori, '');
    }
  }
  righe.push(`Totale: ${totKo} errori su ${totFatti} item svolti.`);
  return righe.join('\n');
}

function vistaEsporta() {
  const box = el('div', {});
  const testo = testoReport();
  const ta = el('textarea', { id: 'esporta-area' });
  ta.value = testo;
  box.append(
    el('div', { class: 'intest' },
      el('button', { class: 'indietro', onclick: () => vai({ vista: 'home' }) }, '‹'),
      el('h1', {}, 'Esporta gli errori')
    ),
    el('p', { class: 'sotto' }, 'Copia questo testo e incollalo in chat per la correzione e l’aggiornamento del registro.'),
    el('div', { class: 'card' }, ta),
    el('div', { class: 'azioni' },
      el('button', { class: 'primario', onclick: async (ev) => {
        try { await navigator.clipboard.writeText(testo); ev.target.textContent = 'Copiato ✓'; }
        catch (e) { ta.select(); document.execCommand('copy'); ev.target.textContent = 'Copiato ✓'; }
      } }, 'Copia negli appunti'),
      navigator.share ? el('button', { onclick: () => navigator.share({ text: testo }).catch(() => {}) }, 'Condividi…') : null
    )
  );
  return box;
}

/* ============================== avvio ============================== */

async function avvia() {
  try {
    const r = await fetch('esercizi.json', { cache: 'no-cache' });
    if (r.ok) DATI = await r.json();
  } catch (e) { /* file:// o offline senza cache: si usa il fallback */ }
  if (!DATI && window.ESERCIZI) DATI = window.ESERCIZI;
  if (!DATI) {
    document.getElementById('app').innerHTML =
      '<div class="card"><strong>Esercizi non trovati.</strong><p>Manca <code>esercizi.json</code>: esegui <code>php converti.php</code> nella cartella app/ e ricarica.</p></div>';
    return;
  }
  render();
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
avvia();
</script>
